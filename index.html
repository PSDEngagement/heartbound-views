<body>

  <!-- =========================

  <!-- =========================

  <!-- =========================

  <!-- =========================
       FOOTER

  <footer>

  </footer>


  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    /*
      THAY URL NÀY bằng URL Cloudflare Worker của bạn.

      Ví dụ:

      https://heartbound-view-tracker.xxx.workers.dev
    */

    const WORKER_URL =
      "https://heartbound-view-tracker.vokhanh2210.workers.dev";


    /*
      TARGET
    */

    const TARGET_VIEWS = 25000000;


    /*
      Bangkok timezone
    */

    const BANGKOK_TIMEZONE =
      "Asia/Bangkok";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const totalElement =
      document.getElementById("total");

    const updatedElement =
      document.getElementById("updated");

    const refreshButton =
      document.getElementById("refreshBtn");

    const statusElement =
      document.getElementById("status");

    const progressElement =
      document.getElementById("progress");

    const progressTextElement =
      document.getElementById("progressText");


    /* =====================================================
       FORMAT NUMBER
    ===================================================== */

    function formatNumber(number) {

      if (number == null) {
        return "—";
      }

      return Number(number).toLocaleString("en-US");

    }


    /* =====================================================
       FORMAT BANGKOK TIME
    ===================================================== */

    function formatBangkokTime(dateString) {

      if (!dateString) {
        return "Chưa cập nhật";
      }

      const date =
        new Date(dateString);

      return (
        "Updated: " +
        date.toLocaleString(
          "en-GB",
          {
            timeZone: BANGKOK_TIMEZONE,

            day: "2-digit",
            month: "2-digit",
            year: "numeric",

            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",

            hour12: false
          }
        ) +
        " (BKK)"
      );

    }


    /* =====================================================
       ANIMATE NUMBER
    ===================================================== */

    function animateNumber(
      element,
      from,
      to,
      duration = 1000
    ) {

      from = Number(from) || 0;
      to = Number(to) || 0;

      if (from === to) {

        element.textContent =
          formatNumber(to);

        return;

      }

      const startTime =
        performance.now();

      function update(currentTime) {

        const elapsed =
          currentTime - startTime;

        const progress =
          Math.min(
            elapsed / duration,
            1
          );

        /*
          Smooth easing
        */

        const eased =
          1 - Math.pow(
            1 - progress,
            3
          );

        const current =
          Math.round(
            from +
            (to - from) * eased
          );

        element.textContent =
          formatNumber(current);

        if (progress < 1) {

          requestAnimationFrame(update);

        }

      }

      requestAnimationFrame(update);

    }


    /* =====================================================
       UPDATE PROGRESS
    ===================================================== */

    function updateProgress(total) {

      const percentage =
        Math.min(
          (Number(total) / TARGET_VIEWS) * 100,
          100
        );

      progressElement.style.width =
        percentage + "%";

      progressTextElement.textContent =
        percentage.toFixed(2) + "%";

    }


    /* =====================================================
       UPDATE PLATFORM
    ===================================================== */

    function updatePlatform(
      platform,
      newValue
    ) {

      const card =
        document.querySelector(
          `.card[data-platform="${platform}"]`
        );

      if (!card) {
        return;
      }

      const element =
        card.querySelector(".views");

      const oldValue =
        Number(
          element.dataset.value || 0
        );

      element.classList.remove("loading");

      /*
        Instagram có thể trả null
      */

      if (newValue == null) {

        element.textContent = "—";

        element.dataset.value = "";

        return;

      }

      /*
        Animate tăng từ số cũ → số mới
      */

      animateNumber(
        element,
        oldValue,
        Number(newValue),
        900
      );

      element.dataset.value =
        Number(newValue);

    }


    /* =====================================================
       FETCH FROM CLOUDFLARE WORKER
    ===================================================== */

    async function fetchViews() {

      refreshButton.disabled = true;

      refreshButton.textContent =
        "Đang cập nhật...";

      statusElement.textContent =
        "Đang lấy dữ liệu...";

      try {

        /*
          Worker endpoint:

          GET /views
        */

        const response =
          await fetch(
            WORKER_URL + "/views",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Worker HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.message ||
            "Không lấy được dữ liệu"
          );

        }


        /* =========================
           PLATFORM VIEWS
        ========================= */

        const views =
          data.views || {};


        updatePlatform(
          "youtube",
          views.youtube
        );

        updatePlatform(
          "tiktok",
          views.tiktok
        );

        updatePlatform(
          "instagram",
          views.instagram
        );

        updatePlatform(
          "facebook",
          views.facebook
        );

        updatePlatform(
          "x",
          views.x
        );


        /* =========================
           TOTAL
        ========================= */

        const total =
          Number(data.total) || 0;


        const oldTotal =
          Number(
            totalElement.dataset.value || 0
          );


        animateNumber(
          totalElement,
          oldTotal,
          total,
          1200
        );


        totalElement.dataset.value =
          total;


        /* =========================
           TARGET
        ========================= */

        updateProgress(total);


        /* =========================
           UPDATED TIME
        ========================= */

        updatedElement.textContent =
          formatBangkokTime(
            data.updatedAt
          );


        statusElement.textContent =
          "Đã cập nhật thành công";


      } catch (error) {

        console.error(error);

        statusElement.textContent =
          "Không thể kết nối Worker";

        console.error(
          "Heartbound tracker error:",
          error
        );

      } finally {

        refreshButton.disabled =
          false;

        refreshButton.textContent =
          "Cập nhật ngay";

      }

    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    fetchViews();


    /*
      Tự kiểm tra Worker mỗi 60 giây.

      Cron của Worker vẫn chạy mỗi 5 phút.
      Website chỉ đọc dữ liệu mới từ KV.
    */

    setInterval(
      fetchViews,
      60 * 1000
    );

  </script>

</body>
