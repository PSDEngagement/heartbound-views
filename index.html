<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heartbound Trailer Views | PerthSanta</title>

  <!-- Fonts matching Series Trends page -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #070707;
      min-height: 100vh;
    }

    body {
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle cinematic background glow */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(127, 29, 29, 0.25), transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(30, 58, 138, 0.12), transparent 50%),
        radial-gradient(ellipse 50% 30% at 20% 70%, rgba(127, 29, 29, 0.1), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .title-serif {
      font-family: "Cormorant Garamond", Georgia, serif;
    }

    .script-font {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* =========================
       HEADER
    ========================= */
    .header {
      text-align: center;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .header h1 .red {
      color: #ef4444;
    }

    .header p {
      color: #9ca3af;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .header-right {
      text-align: right;
      padding-top: 8px;
    }

    .header-right .script {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    .header-right .line {
      margin-left: auto;
      margin-top: 6px;
      width: 80px;
      height: 1px;
      background: rgba(239, 68, 68, 0.6);
      border-radius: 999px;
    }

    /* =========================
       TARGET BOX
    ========================= */
    .target-box {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(165deg, #1a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 16px;
      padding: 22px 26px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .target-box::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      opacity: 0.5;
    }

    .target-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .target-title {
      font-size: 0.85rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .target-number {
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #1f1f1f;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #7f1d1d, #ef4444);
      border-radius: 999px;
      transition: width 1s ease;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }

    .progress-text {
      margin-top: 10px;
      text-align: right;
      color: #6b7280;
      font-size: 0.8rem;
    }

    /* =========================
       TOTAL BOX
    ========================= */
    .total-box {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #ef4444;
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
      box-shadow:
        0 0 40px rgba(239, 68, 68, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .total-box .label {
      font-size: 0.85rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .total-box .number {
      font-size: 3.4rem;
      font-weight: 800;
      color: #ef4444;
      margin: 10px 0 6px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.35);
    }

    .increase {
      font-size: 0.95rem;
      color: #f87171;
      font-weight: 600;
      margin-bottom: 8px;
      min-height: 22px;
    }

    .updated {
      font-size: 0.85rem;
      color: #6b7280;
    }

    /* =========================
       PLATFORM GRID
    ========================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 900px;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: linear-gradient(165deg, #2a0a0a 0%, #141414 45%, #0a0a0a 100%);
      border: 1px solid #3f1a1a;
      border-radius: 14px;
      padding: 22px 16px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 25%;
      right: 25%;
      bottom: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ef4444, transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      border-color: #ef4444;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.2);
    }

    .card:hover::after {
      opacity: 0.7;
    }

    .card .platform {
      font-size: 0.8rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .card .views {
      font-size: 1.55rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
      min-height: 32px;
    }

    .card .views.loading {
      color: #4b5563;
    }

    /* =========================
       WATCH BUTTON
    ========================= */
    .watch-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 20px;
      background: transparent;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      transition: all 0.25s ease;
    }

    .watch-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
    }

    /* =========================
       STATUS
    ========================= */
    .status {
      margin-top: 4px;
      color: #6b7280;
      font-size: 0.8rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* =========================
       FOOTER
    ========================= */
    footer {
      margin-top: auto;
      padding-top: 48px;
      color: #4b5563;
      font-size: 0.8rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* =========================
       DIVIDER
    ========================= */
    .divider {
      width: 100%;
      max-width: 900px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(127, 29, 29, 0.5), transparent);
      margin: 8px 0 28px;
      position: relative;
      z-index: 1;
    }

    /* =========================
       MOBILE
    ========================= */
    @media (max-width: 640px) {
      body {
        padding: 28px 14px 48px;
      }

      .header h1 {
        font-size: 2.1rem;
      }

      .header-top {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .header-right {
        text-align: center;
        margin-top: 8px;
      }

      .header-right .line {
        margin: 6px auto 0;
      }

      .total-box {
        padding: 26px 18px;
      }

      .total-box .number {
        font-size: 2.6rem;
      }

      .target-box {
        padding: 18px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .card {
        padding: 18px 10px;
      }

      .card .views {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->
  <div class="header">
    <div class="header-top">
      <div>
        <h1 class="title-serif">
          HEARTBOUND <span class="red">Views</span>
        </h1>
        <p>Official Trailer Views Tracker · PerthSanta</p>
      </div>
      <div class="header-right">
        <p class="script-font script">Together We Make It Happen</p>
        <div class="line"></div>
      </div>
    </div>
  </div>

  <!-- =========================
       TARGET
  ========================== -->
  <div class="target-box">
    <div class="target-header">
      <div class="target-title">Target</div>
      <div class="target-number" id="targetNumber">25,000,000</div>
    </div>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <div class="progress-text" id="progressText">0.00%</div>
  </div>

  <!-- =========================
       TOTAL
  ========================== -->
  <div class="total-box">
    <div class="label">Total Views</div>
    <div class="number" id="total">—</div>
    <div class="increase" id="increase">—</div>
    <div class="updated" id="updated">Not updated yet</div>
  </div>

  <div class="divider"></div>

  <!-- =========================
       PLATFORMS
  ========================== -->
  <div class="grid" id="platforms">

    <div class="card" data-platform="youtube">
      <div class="platform">YouTube</div>
      <div class="views loading">—</div>
      <a class="watch-btn"
         href="https://youtu.be/39nX9ybZSB0?si=UJbAt1fyQTKaZDi-"
         target="_blank"
         rel="noopener noreferrer">
        WATCH
      </a>
    </div>

    <div class="card" data-platform="tiktok">
      <div class="platform">TikTok</div>
      <div class="views loading">—</div>
      <a class="watch-btn"
         href="https://vt.tiktok.com/ZSby4JCNw/"
         target="_blank"
         rel="noopener noreferrer">
        WATCH
      </a>
    </div>

    <div class="card" data-platform="instagram">
      <div class="platform">Instagram</div>
      <div class="views loading">—</div>
      <a class="watch-btn"
         href="https://www.instagram.com/reel/DZfrkM8NhdP/?stkn=MXY2bTZjZ2ZiYmZldw=="
         target="_blank"
         rel="noopener noreferrer">
        WATCH
      </a>
    </div>

    <div class="card" data-platform="facebook">
      <div class="platform">Facebook</div>
      <div class="views loading">—</div>
      <a class="watch-btn"
         href="https://www.facebook.com/share/v/18NrzxALYo/"
         target="_blank"
         rel="noopener noreferrer">
        WATCH
      </a>
    </div>

    <div class="card" data-platform="x">
      <div class="platform">X</div>
      <div class="views loading">—</div>
      <a class="watch-btn"
         href="https://x.com/kimm221020/status/2037870318182608961"
         target="_blank"
         rel="noopener noreferrer">
        WATCH
      </a>
    </div>

  </div>

  <!-- =========================
       STATUS
  ========================== -->
  <div class="status" id="status">Connecting...</div>

  <!-- =========================
       FOOTER
  ========================== -->
  <footer>
    Data from Refetcher · Public data · PerthSanta Hub
  </footer>

  <script>
    /* =====================================================
       CONFIG
    ===================================================== */

    // Worker endpoint (đã sửa thành /views vì API hiện tại nằm ở đây)
    const WORKER_URL =
      "https://heartbound-view-tracker.vokhanh2210.workers.dev/views";

    const TARGET_VIEWS =
      25000000;

    const BANGKOK_TIMEZONE =
      "Asia/Bangkok";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const totalElement =
      document.getElementById("total");

    const increaseElement =
      document.getElementById("increase");

    const updatedElement =
      document.getElementById("updated");

    const statusElement =
      document.getElementById("status");

    const progressElement =
      document.getElementById("progress");

    const progressTextElement =
      document.getElementById("progressText");


    /* =====================================================
       FORMAT NUMBER
    ===================================================== */

    function formatNumber(number) {
      if (number == null) {
        return "—";
      }
      return Number(number).toLocaleString("en-US");
    }


    /* =====================================================
       FORMAT BANGKOK TIME
    ===================================================== */

    function formatBangkokTime(dateString) {
      if (!dateString) {
        return "Not updated yet";
      }

      const date = new Date(dateString);

      return (
        "Updated: " +
        date.toLocaleString(
          "en-GB",
          {
            timeZone: BANGKOK_TIMEZONE,
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }
        ) +
        " (BKK)"
      );
    }


    /* =====================================================
       ANIMATE NUMBER
    ===================================================== */

    function animateNumber(element, from, to, duration = 1000) {
      from = Number(from) || 0;
      to = Number(to) || 0;

      if (from === to) {
        element.textContent = formatNumber(to);
        return;
      }

      const start = performance.now();

      function update(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const ease = 1 - Math.pow(1 - progress, 3); // easeOutCubic
        const current = Math.round(from + (to - from) * ease);

        element.textContent = formatNumber(current);

        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }


    /* =====================================================
       UPDATE PROGRESS
    ===================================================== */

    function updateProgress(total) {
      const percent = Math.min((total / TARGET_VIEWS) * 100, 100);

      progressElement.style.width = percent + "%";
      progressTextElement.textContent = percent.toFixed(2) + "%";
    }


    /* =====================================================
       UPDATE PLATFORM CARDS
    ===================================================== */

    function updatePlatforms(viewsData) {
      const cards = document.querySelectorAll(".card");

      cards.forEach(card => {
        const platform = card.dataset.platform;
        const viewsEl = card.querySelector(".views");

        if (viewsData && viewsData[platform] != null) {
          viewsEl.classList.remove("loading");
          viewsEl.textContent = formatNumber(viewsData[platform]);
        }
      });
    }


    /* =====================================================
       FETCH VIEWS
    ===================================================== */

    async function fetchViews() {
      try {
        statusElement.textContent = "Updating...";

        const response = await fetch(WORKER_URL + "?t=" + Date.now());

        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        const data = await response.json();

        // API hiện tại trả về { success, views: {...}, total, previousTotal, updatedAt }
        if (!data.success && data.views == null) {
          throw new Error("Invalid response format");
        }

        const views = data.views || {};
        const total = Number(data.total) || 0;
        const previousTotal =
          data.previousTotal != null
            ? Number(data.previousTotal)
            : null;

        /* =========================
           PLATFORMS
        ========================= */
        updatePlatforms(views);

        /* =========================
           TOTAL + INCREASE
        ========================= */
        if (previousTotal !== null) {
          const increase = total - previousTotal;
          increaseElement.textContent =
            (increase >= 0 ? "+" : "") +
            formatNumber(increase) +
            " views since last update";
        } else {
          increaseElement.textContent = "";
        }

        const currentDisplayed =
          totalElement.dataset.value !== undefined &&
          totalElement.dataset.value !== ""
            ? Number(totalElement.dataset.value)
            : null;

        animateNumber(
          totalElement,
          currentDisplayed === null ? total : currentDisplayed,
          total,
          currentDisplayed === null ? 0 : 1200
        );

        totalElement.dataset.value = total;

        /* =========================
           TARGET
        ========================= */
        updateProgress(total);

        /* =========================
           UPDATED TIME
        ========================= */
        updatedElement.textContent = formatBangkokTime(data.updatedAt);

        statusElement.textContent = "Auto-updating · Checking every minute";

      } catch (error) {
        console.error("Heartbound tracker error:", error);
        statusElement.textContent = "Unable to connect to the Worker";
      }
    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */
    fetchViews();


    /* =====================================================
       AUTO UPDATE
    ===================================================== */
    setInterval(fetchViews, 60 * 1000);

  </script>

</body>
</html>
