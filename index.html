<body>

  <!-- =========================

  <script>

    /* =====================================================
       CONFIG
    ===================================================== */

    const WORKER_URL =
      "https://heartbound-view-tracker.vokhanh2210.workers.dev";

    const TARGET_VIEWS =
      25000000;

    const BANGKOK_TIMEZONE =
      "Asia/Bangkok";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const totalElement =
      document.getElementById("total");

    const increaseElement =
      document.getElementById("increase");

    const updatedElement =
      document.getElementById("updated");

    const statusElement =
      document.getElementById("status");

    const progressElement =
      document.getElementById("progress");

    const progressTextElement =
      document.getElementById("progressText");


    /* =====================================================
       FORMAT NUMBER
    ===================================================== */

    function formatNumber(number) {

      if (number == null) {
        return "—";
      }

      return Number(number).toLocaleString("en-US");

    }


    /* =====================================================
       FORMAT BANGKOK TIME
    ===================================================== */

    function formatBangkokTime(dateString) {

      if (!dateString) {
        return "Not updated yet";
      }

      const date =
        new Date(dateString);

      return (
        "Updated: " +
        date.toLocaleString(
          "en-GB",
          {
            timeZone: BANGKOK_TIMEZONE,
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }
        ) +
        " (BKK)"
      );

    }


    /* =====================================================
       ANIMATE NUMBER
    ===================================================== */

    function animateNumber(
      element,
      from,
      to,
      duration = 1000
    ) {

      from = Number(from) || 0;
      to = Number(to) || 0;

      if (from === to) {

        element.textContent =
          formatNumber(to);

        return;

      }

      const startTime =
        performance.now();

      function update(currentTime) {

        const elapsed =
          currentTime - startTime;

        const progress =
          Math.min(
            elapsed / duration,
            1
          );

        const eased =
          1 - Math.pow(
            1 - progress,
            3
          );

        const current =
          Math.round(
            from +
            (to - from) * eased
          );

        element.textContent =
          formatNumber(current);

        if (progress < 1) {
          requestAnimationFrame(update);
        }

      }

      requestAnimationFrame(update);

    }


    /* =====================================================
       UPDATE PROGRESS
    ===================================================== */

    function updateProgress(total) {

      const percentage =
        Math.min(
          (Number(total) / TARGET_VIEWS) * 100,
          100
        );

      progressElement.style.width =
        percentage + "%";

      progressTextElement.textContent =
        percentage.toFixed(2) + "%";

    }


    /* =====================================================
       UPDATE PLATFORM
    ===================================================== */

    function updatePlatform(
      platform,
      newValue
    ) {

      const card =
        document.querySelector(
          `.card[data-platform="${platform}"]`
        );

      if (!card) {
        return;
      }

      const element =
        card.querySelector(".views");

      const oldValue =
        Number(
          element.dataset.value || 0
        );

      element.classList.remove("loading");

      if (newValue == null) {

        element.textContent = "—";
        element.dataset.value = "";

        return;

      }

      animateNumber(
        element,
        oldValue,
        Number(newValue),
        900
      );

      element.dataset.value =
        Number(newValue);

    }


    /* =====================================================
       FETCH FROM CLOUDFLARE WORKER
    ===================================================== */

    async function fetchViews() {

      statusElement.textContent =
        "Checking for updates...";

      try {

        const response =
          await fetch(
            WORKER_URL + "/views",
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Worker HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.message ||
            "Unable to retrieve data"
          );

        }


        /* =========================
           PLATFORM VIEWS
        ========================= */

        const views =
          data.views || {};


        updatePlatform(
          "youtube",
          views.youtube
        );

        updatePlatform(
          "tiktok",
          views.tiktok
        );

        updatePlatform(
          "instagram",
          views.instagram
        );

        updatePlatform(
          "facebook",
          views.facebook
        );

        updatePlatform(
          "x",
          views.x
        );


        /* =========================
           TOTAL
        ========================= */

        const total =
          Number(data.total) || 0;


        const previousTotal =
          Number(
            totalElement.dataset.value || 0
          );


        /*
          Only calculate the increase
          when the total actually changes.
        */

        if (
          totalElement.dataset.value !== undefined &&
          total > previousTotal
        ) {

          const increase =
            total - previousTotal;

          increaseElement.textContent =
            "+" +
            formatNumber(increase) +
            " views since last update";

        }


        /*
          First load
        */

        if (
          totalElement.dataset.value === undefined
        ) {

          increaseElement.textContent =
            "First update";

        }


        animateNumber(
          totalElement,
          previousTotal,
          total,
          1200
        );


        totalElement.dataset.value =
          total;


        /* =========================
           TARGET
        ========================= */

        updateProgress(total);


        /* =========================
           UPDATED TIME
        ========================= */

        updatedElement.textContent =
          formatBangkokTime(
            data.updatedAt
          );


        statusElement.textContent =
          "Auto-updating · Checking every minute";


      } catch (error) {

        console.error(
          "Heartbound tracker error:",
          error
        );

        statusElement.textContent =
          "Unable to connect to the Worker";

      }

    }


    /* =====================================================
       INITIAL LOAD
    ===================================================== */

    fetchViews();


    /* =====================================================
       AUTO UPDATE
    ===================================================== */

    /*
      The website checks the Worker every 60 seconds.

      Cloudflare Cron updates the stored data
      every 5 minutes.
    */

    setInterval(
      fetchViews,
      60 * 1000
    );

  </script>

</body>
